<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis vinotecas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday y cálido: una app de bodega que da gusto abrir cada día
   IDEA la vinoteca refrigerada vista de frente: armario de cristal oscuro, luz cálida arriba, baldas de madera
   PICTURE el armario con cada botella brillante del color de su vino, tocable
   COLOUR fondo rosado pálido, granate #8c1d3f dominante, verde botella #24493c de apoyo, oro de cápsula #e0a526 para lo que está listo
   TYPE Fraunces 700 (letra de etiqueta) + Figtree
   LAYOUT móvil: cabecera compacta, armario, lista y botón fijo de añadir; escritorio: armario fijo a la izquierda y lista a la derecha */
:root{color-scheme:light dark;--bg:light-dark(#fbf1f0,#160e12);--card:light-dark(#ffffff,#21161b);--ink:light-dark(#2a0f1a,#f6e9ec);--mut:light-dark(#7d5e68,#b39ea6);--line:light-dark(#efdcdf,#382630);--gar:light-dark(#8c1d3f,#e27a96);--garf:#8c1d3f;--green:light-dark(#24493c,#86c2a6);--gold:#e0a526;--soft:light-dark(#f6e3e5,#2c1d24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{padding:18px 0 6px}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 20px Fraunces,serif;color:var(--gar)}
.esps{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.pill{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:600}
.pill.on{background:var(--garf);border-color:var(--garf);color:#fff}
.pill.add{border-style:dashed;color:var(--mut)}
.ibtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600;font-size:15px}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;padding-top:10px;padding-bottom:110px}
@media(max-width:880px){main{grid-template-columns:minmax(0,1fr)}}
@media(min-width:881px){.left{position:sticky;top:12px}}
.vthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.vthead h1{font-size:clamp(34px,5vw,46px)}
.vtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.vtab{flex:none;border:0;background:var(--soft);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;color:var(--mut)}
.vtab.on{background:var(--ink);color:var(--bg)}
.vtab.add{background:transparent;border:1.5px dashed var(--line)}
/* el armario */
.fridge{background:linear-gradient(180deg,#3a2a30 0,#1b1216 14%,#140d10 100%);border-radius:26px;padding:14px;box-shadow:0 0 0 7px light-dark(#d9c4c9,#2e2128),0 18px 40px -18px #4a0e2380;position:relative}
.fridge::before{content:"";position:absolute;left:12%;right:12%;top:8px;height:4px;border-radius:4px;background:#ffe7bd;box-shadow:0 0 22px 8px #ffd99a55}
.glass{border-radius:16px;padding:18px 10px 8px;background:radial-gradient(120% 60% at 50% 0,#ffdca329,transparent 60%),linear-gradient(180deg,#1f1519,#120a0d);overflow-x:auto}
.shelf{display:grid;gap:clamp(4px,1vw,8px);align-items:end;padding:6px 6px 10px;margin-bottom:10px;position:relative}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:3px;background:linear-gradient(180deg,#a87a52,#6e4a2e);box-shadow:0 4px 8px #0008}
.rl{position:absolute;left:-8px;top:50%;transform:translateY(-60%);font-size:11px;font-weight:700;color:#8a7078;width:12px;text-align:center}
.shelves{padding-left:14px;margin:0 auto}
.slot{aspect-ratio:1;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#070405 45%,#24181c 70%);box-shadow:inset 0 2px 5px #000;position:relative}
.slot.f{background:radial-gradient(circle at 34% 30%,#ffffffb0 0 6%,transparent 18%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 70%,#000) 0 22%,var(--c) 23% 52%,color-mix(in srgb,var(--c) 45%,#000) 53% 64%,#0c0809 66%);box-shadow:0 3px 6px #000c}
.slot.ready::after{content:"";position:absolute;top:-2px;right:-2px;width:28%;height:28%;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #140d10}
.slot.sel{outline:3px solid #fff;outline-offset:2px}
.slot.mine{outline:2px dashed var(--gold);outline-offset:2px}
.placing .slot:not(.f){background:radial-gradient(circle at 50% 45%,#2d2210 45%,#3a2a12 72%);box-shadow:inset 0 0 0 2px #e0a52680}
@media(prefers-reduced-motion:no-preference){.slot.f{transition:transform .15s}.slot.f:hover{transform:scale(1.08)}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);padding:14px 4px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:700 clamp(24px,3.4vw,30px)/1 Fraunces,serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut);white-space:nowrap}
.stat.go b{color:var(--green)}
.loose{font-size:14px;color:var(--mut);margin:10px 4px 0}
.bar{background:var(--gold);color:#2a1a08;border-radius:14px;padding:10px 12px 10px 16px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
/* lista */
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 16px;min-height:40px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000001f}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:44px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;min-height:38px;font-size:14px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.chip i{width:10px;height:10px;border-radius:50%}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gar);outline:0}
textarea{min-height:92px;resize:vertical}
.list{display:grid;gap:8px}
.wine{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:18px;padding:12px 16px 12px 14px;box-shadow:0 1px 0 var(--line)}
.wine:hover{box-shadow:0 0 0 1.5px var(--gar)}
.wine b{display:block;font:700 18px/1.2 Fraunces,serif}
.wine small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.qty{text-align:right;white-space:nowrap}
.qty b{font:700 26px/1 Fraunces,serif}
.qty span{display:block;font-size:12px;color:var(--mut)}
.st{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.listo{background:color-mix(in srgb,var(--gold) 26%,transparent);color:light-dark(#7a5200,#f3c860)}
.st.guardar{background:var(--soft);color:var(--mut)}
.st.pasado{background:color-mix(in srgb,var(--gar) 16%,transparent);color:var(--gar)}
.st.agotado{background:var(--soft);color:var(--mut)}
.empty{background:var(--card);border-radius:20px;padding:28px 22px;color:var(--mut);text-align:center}
.empty h2{color:var(--ink);font-size:28px;margin:10px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 18px;min-height:46px;font-weight:700}
.btn.p{background:var(--garf);color:#fff;border-color:var(--garf)}
.btn.g{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.s{min-height:40px;padding:7px 13px;font-size:14px}
.btn.d{color:#c0392b}
.btn:disabled{opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:5;display:inline-flex;align-items:center;gap:10px;border:0;background:var(--garf);color:#fff;border-radius:999px;padding:14px 22px 14px 18px;font-weight:700;font-size:16px;box-shadow:0 10px 24px -6px #8c1d3f99}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:8;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;max-width:min(520px,calc(100% - 32px));font-size:15px;box-shadow:0 8px 24px #0005}
.toast:empty{display:none}
/* hoja */
.ov{position:fixed;inset:0;background:#1a0a1199;display:none;z-index:9;overflow-y:auto;padding:5vh 12px}
.ov.on{display:flex;justify-content:center;align-items:flex-start}
.sheet{background:var(--bg);color:var(--ink);border-radius:24px;width:min(680px,100%);overflow:hidden;box-shadow:0 20px 50px #0007}
.sheet .in{padding:20px 22px 24px}
@media(max-width:600px){.ov{padding:0;align-items:flex-end!important}.ov.on{align-items:flex-end}.sheet{border-radius:24px 24px 0 0;max-height:94svh;overflow-y:auto}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.sh h2{font-size:30px}
.x{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.hero{background:var(--garf);color:#fff;padding:22px 22px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:end}
.hero h2{font-size:clamp(26px,5vw,34px)}
.hero p{margin:4px 0 0;color:#f4d6de;font-size:15px}
.hero .qty b{font-size:40px}.hero .qty span{color:#f4d6de}
.hero .x{background:#ffffff22;color:#fff;align-self:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:14px;font-weight:600;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:5px;color:var(--ink)}
.full{grid-column:1/-1}
.ai{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--card)),var(--card));border-radius:18px;padding:14px;margin:14px 0;display:grid;gap:10px}
.conf{font-size:14px;border-radius:10px;padding:9px 11px;background:var(--card)}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:16px 0;font-size:15px}
.facts dt{color:var(--mut);font-weight:600}
.facts dd{margin:0}
.win{height:10px;border-radius:5px;background:var(--soft);position:relative;margin:8px 0 2px}
.win i{position:absolute;top:0;bottom:0;background:var(--gold);border-radius:5px}
.win u{position:absolute;top:-5px;bottom:-5px;width:4px;background:var(--gar);border-radius:2px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--gar);font-weight:700;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px}
.ppl{display:grid;gap:6px;margin:10px 0}
.ppl div{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:6px 6px 6px 14px;min-height:50px}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--ink);font-size:15px}
.check input{width:24px;min-height:24px;accent-color:var(--garf)}
/* acceso */
.authv{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.authc{width:min(420px,100%);background:var(--card);border-radius:24px;padding:28px 24px;box-shadow:0 20px 50px -24px #4a0e2380}
.authc h1{font-size:clamp(32px,8vw,40px);margin:14px 0 6px;color:var(--gar)}
.authc form{display:grid;gap:12px;margin-top:18px}
.authc .btn{width:100%}
.lnk{border:0;background:none;color:var(--gar);font-weight:700;padding:8px 0;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.err{color:#c0392b;font-size:14px;margin:0}
.ok{color:var(--green);font-size:14px;margin:0}
body[data-view=auth] .app,body[data-view=auth] .fab,body[data-view=app] .authv,body[data-view=setup] .app,body[data-view=setup] .fab,body[data-view=setup] .authv{display:none}
body:not([data-view=setup]) .setupv{display:none}
.setupv{max-width:720px;margin:0 auto;padding:40px 16px}
.setupv code{background:var(--soft);border-radius:6px;padding:1px 6px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--garf);color:#fff;font:700 18px Fraunces,serif;display:grid;place-items:center}
.hbtns{display:flex;gap:8px;align-items:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body data-view="auth">
<div class="setupv">
  <h1 style="font-size:36px;color:var(--gar)">Falta configurar la app</h1>
  <p>Edita <code>config.js</code> y pon la URL y la clave pública (<em>anon key</em>) de tu proyecto de Supabase. Los pasos están en el <code>README.md</code> del repositorio.</p>
</div>

<div class="authv">
  <div class="authc" id="authc"></div>
</div>

<div class="wrap app">
  <header>
    <div class="hrow">
      <div class="brand"><svg width="22" height="30" viewBox="0 0 24 64" aria-hidden="true"><path d="M9 2h6v14c0 4 6 6 6 12v32a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V28c0-6 6-8 6-12z" fill="currentColor"/><rect x="9" y="2" width="6" height="8" fill="#e0a526"/></svg>Mis vinotecas</div>
      <div class="hbtns"><span id="who"></span><button class="avatar" id="acct" aria-label="Mi cuenta"></button></div>
    </div>
    <div class="esps" id="esps"></div>
  </header>
  <main>
    <section class="left">
      <div class="vthead"><h1 id="vtTitle">Mi bodega</h1></div>
      <div class="vtabs" id="vts"></div>
      <div id="placebar"></div>
      <div class="fridge" id="fridge"><div class="glass"><div class="shelves" id="rack"></div></div></div>
      <div class="legend" id="legend"></div>
      <p class="loose" id="loose"></p>
      <div class="stats" id="stats"></div>
    </section>
    <section>
      <div class="lhead">
        <h2 style="font-size:28px">Vinos</h2>
        <div class="seg"><button class="on" id="tBod">En bodega</button><button id="tBeb">Bebidos</button></div>
      </div>
      <div id="tools">
        <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Busca vino, bodega o uva" aria-label="Buscar"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>
</div>
<button class="fab" id="addWine"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Añadir vino</button>
<div class="toast" id="msg" role="status"></div>
<div class="ov" id="ov"><div class="sheet" id="card" role="dialog" aria-modal="true"></div></div>

<script>
{
const TIPOS={tinto:['Tinto','#9b1631'],blanco:['Blanco','#e9cf6b'],rosado:['Rosado','#f08aa4'],espumoso:['Espumoso','#f3e7b4'],dulce:['Dulce','#d08a2e'],generoso:['Generoso','#a4582f']};
const ESTADOS=[['','Todos'],['listo','Para beber ya'],['guardar','Para guardar'],['pasado','Pasados'],['agotado','Agotados']];
const Y=new Date().getFullYear();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={me:null,email:'',names:{},espacios:[],miembros:[],vinotecas:[],vinos:[],consumos:[],esp:null,vt:null,q:'',ft:'',fe:'',tab:'bod',placing:null,slot:null,loaded:false};
let mt,rt,chan=null;
try{S.esp=localStorage.getItem('vt_esp');S.vt=localStorage.getItem('vt_vt')}catch(e){}
const remember=()=>{try{localStorage.setItem('vt_esp',S.esp||'');localStorage.setItem('vt_vt',S.vt||'')}catch(e){}};
const msg=(t,stay)=>{$('msg').textContent=t||'';clearTimeout(mt);if(t&&!stay)mt=setTimeout(()=>{$('msg').textContent=''},5000)};
const X='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const bottle=(c,w=22)=>`<svg width="${w}" height="${Math.round(w*64/24)}" viewBox="0 0 24 64" aria-hidden="true"><path d="M9 2h6v14c0 4 6 6 6 12v32a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V28c0-6 6-8 6-12z" fill="${c}"/><path d="M6 30c0-4 3-6 4-8v36H7a1 1 0 0 1-1-1z" fill="#fff" opacity=".22"/><rect x="9" y="2" width="6" height="9" rx="1" fill="#e0a526"/><rect x="5" y="38" width="14" height="13" rx="1.5" fill="#fff" opacity=".9"/></svg>`;

/* ---------- Supabase ---------- */
const CFG=window.VINOTECA_CONFIG||{};
const sb=CFG.url&&CFG.anonKey&&window.supabase?window.supabase.createClient(CFG.url,CFG.anonKey):null;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const camel=o=>{const r={};for(const k in o)r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=o[k];return r};
const snake=o=>{const r={};for(const k in o)r[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())]=o[k];return r};
const ms=x=>x?new Date(x).getTime():0;
async function q(p){const{data,error}=await p;if(error)throw error;return data}
const ins=(t,d)=>q(sb.from(t).insert(snake(d)));
const upd=(t,id,d)=>q(sb.from(t).update(snake(d)).eq('id',id));
const del=(t,id)=>q(sb.from(t).delete().eq('id',id));

async function loadAll(){
  const[es,mi,vt,vi,co,pr]=await Promise.all([
    q(sb.from('espacios').select('*')),q(sb.from('miembros').select('*')),q(sb.from('vinotecas').select('*')),
    q(sb.from('vinos').select('*')),q(sb.from('consumos').select('*').order('fecha',{ascending:false}).limit(1000)),
    q(sb.from('profiles').select('id,nombre,email'))]);
  const t=x=>({...camel(x),creado:ms(x.creado)});
  S.espacios=es.map(t).sort((a,b)=>a.creado-b.creado);S.miembros=mi.map(camel);S.vinotecas=vt.map(t);
  S.vinos=vi.map(x=>({...t(x),precio:x.precio==null?null:+x.precio,pos:x.pos||[],puntuaciones:x.puntuaciones||[]}));
  S.consumos=co.map(x=>({...camel(x),fecha:ms(x.fecha)}));
  for(const p of pr)S.names[p.id]=p.nombre||p.email;
  S.loaded=true;render();
}

const vinosDe=id=>S.vinos.filter(v=>v.espacioId===id);
const color=t=>(TIPOS[t]||TIPOS.tinto)[1];
function estado(v){if(!(v.cantidad>0))return'agotado';const d=+v.desde||0,h=+v.hasta||0;if(d&&Y<d)return'guardar';if(h&&Y>h)return'pasado';if(d||h)return'listo';return''}
const ESTXT={listo:'Para beber ya',guardar:'Para guardar',pasado:'Pasado de su momento',agotado:'Agotado'};

function renderRack(){
  const vt=S.vinotecas.find(v=>v.id===S.vt);
  $('fridge').style.display=vt?'':'none';$('legend').style.display=vt?'':'none';
  if(!S.esp||!vt){$('placebar').innerHTML='';$('loose').innerHTML=S.esp&&S.loaded?'<span class="empty" style="display:block">Este espacio aún no tiene vinotecas. Crea la primera con «+ Vinoteca».</span>':'';return}
  const R=+vt.filas||6,C=+vt.cols||8,map={};
  const here=S.vinos.filter(v=>v.vinotecaId===vt.id&&v.cantidad>0);
  for(const v of here)for(const p of v.pos||[])map[p]=v;
  $('fridge').classList.toggle('placing',!!S.placing);
  const rk=$('rack');rk.style.maxWidth=(14+C*58)+'px';rk.style.minWidth=(14+C*30)+'px';
  let h='';
  for(let r=0;r<R;r++){const L=String.fromCharCode(65+r);h+=`<div class="shelf" style="grid-template-columns:repeat(${C},minmax(0,1fr))"><span class="rl">${L}</span>`;
    for(let c=1;c<=C;c++){const k=L+c,v=map[k];
      h+=v?`<button class="slot f${estado(v)==='listo'?' ready':''}${S.slot===k?' sel':''}${S.placing===v.id?' mine':''}" style="--c:${color(v.tipo)}" data-slot="${k}" title="${esc(k+' · '+v.nombre+' '+(v.anada||''))}" aria-label="${esc(k+': '+v.nombre+' '+(v.anada||''))}"></button>`
        :`<button class="slot" data-slot="${k}" aria-label="Hueco ${k} libre"></button>`}
    h+='</div>'}
  rk.innerHTML=h;
  $('legend').innerHTML=Object.entries(TIPOS).map(([k,v])=>`<span><i style="background:${v[1]}"></i>${v[0]}</span>`).join('')+'<span><i style="background:var(--gold)"></i>En su momento</span>';
  const sin=here.reduce((a,v)=>a+Math.max(0,v.cantidad-(v.pos||[]).length),0);
  $('loose').textContent=`${R*C-Object.keys(map).length} huecos libres de ${R*C}`+(sin?` · ${sin} botella${sin>1?'s':''} sin hueco`:'');
  const pv=S.vinos.find(v=>v.id===S.placing);
  $('placebar').innerHTML=pv?`<div class="bar"><span>Colocando ${esc(pv.nombre)}: ${(pv.pos||[]).length} de ${pv.cantidad}. Toca los huecos.</span><button class="btn s" id="donePlace">Hecho</button></div>`:'';
}

  $('chips').innerHTML=ESTADOS.map(([k,t])=>`<button class="chip${S.fe===k?' on':''}" data-fe="${k}">${t}</button>`).join('')+Object.entries(TIPOS).map(([k,v])=>`<button class="chip${S.ft===k?' on':''}" data-ft="${k}"><i style="background:${v[1]}"></i>${v[0]}</button>`).join('');

  if(!S.esp){$('list').innerHTML=`<div class="empty">${bottle('#9b1631',30)}<h2>Empieza por un espacio</h2><p>Un espacio es una casa o un lugar. Dentro tendrás tus vinotecas y podrás invitar a otras personas.</p><button class="btn p" id="newEsp2">Crear mi primer espacio</button></div>`;return}

  const qq=S.q.toLowerCase().trim();
  let vs=vinosDe(S.esp).filter(v=>{const st=estado(v);if(S.fe?st!==S.fe:st==='agotado')return false;if(S.ft&&v.tipo!==S.ft)return false;if(!qq)return true;return[v.nombre,v.bodega,v.uvas,v.dop,v.region,v.anada].join(' ').toLowerCase().includes(qq)});
  const o={listo:0,pasado:1,'':2,guardar:3,agotado:4};
  vs.sort((a,b)=>(o[estado(a)]-o[estado(b)])||String(a.nombre).localeCompare(b.nombre));

  $('list').innerHTML=vs.length?vs.map(v=>{const st=estado(v);return`<button class="wine" data-wine="${esc(v.id)}">${bottle(color(v.tipo))}<div><b>${esc(v.nombre)} ${esc(v.anada||'')}</b><small>${esc([v.bodega,v.dop].filter(Boolean).join(', ')||TIPOS[v.tipo]?.[0]||'')}</small><small>${esc(vtn(v.vinotecaId))}${(v.pos||[]).length?', '+esc(v.pos.join(' ')):''}</small>${st?`<span class="st ${st}">${ESTXT[st]}${(v.desde||v.hasta)&&st!=='agotado'?` ${v.desde||'…'}–${v.hasta||'…'}`:''}</span>`:''}</div><div class="qty"><b>${+v.cantidad||0}</b><span>${+v.cantidad===1?'botella':'botellas'}</span></div></button>`}).join('')
    :`<div class="empty">${vinosDe(S.esp).length?'Ningún vino coincide con la búsqueda.':`${bottle('#9b1631',30)}<h2>La bodega está vacía</h2><p>Añade el primer vino con el botón de abajo.</p>`}</div>`;

async function beber(id){const v=S.vinos.find(x=>x.id===id);if(!v||!(v.cantidad>0))return;
  const pos=(v.pos||[]).slice();const i=S.slot&&pos.includes(S.slot)?pos.indexOf(S.slot):pos.length>=v.cantidad?pos.length-1:-1;if(i>=0)pos.splice(i,1);
  const r=v.cantidad-1;v.cantidad=r;v.pos=pos;S.slot=null;close();render();
  msg(`¡Salud! ${r?`Queda${r===1?'':'n'} ${r} de ${v.nombre}.`:`Era la última de ${v.nombre}.`}`);
  await upd('vinos',id,{cantidad:r,pos});
  await ins('consumos',{espacioId:v.espacioId,vinoId:id,nombre:v.nombre,anada:v.anada||'',tipo:v.tipo,por:S.me});
  refresh()}

async function clickSlot(k){
  const vt=S.vinotecas.find(v=>v.id===S.vt);const owner=S.vinos.find(v=>v.vinotecaId===S.vt&&v.cantidad>0&&(v.pos||[]).includes(k));
  if(S.placing){const v=S.vinos.find(x=>x.id===S.placing);if(!v)return;
    if(owner&&owner.id!==v.id)return ficha(owner.id,k);
    let pos=v.vinotecaId===vt.id?(v.pos||[]).slice():[];
    if(owner)pos=pos.filter(p=>p!==k);else if(pos.length<v.cantidad)pos.push(k);else return msg('Ya están colocadas todas. Toca una de sus botellas para quitarla.');
    v.pos=pos;v.vinotecaId=vt.id;
    if(!owner&&pos.length===v.cantidad){S.placing=null;msg('Botellas colocadas.')}
    render();
    await upd('vinos',v.id,{pos,vinotecaId:vt.id});return}
  if(owner)ficha(owner.id,k);else msg('Hueco '+k+' libre. Añade un vino o abre uno y elige «Colocar en la vinoteca».')
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.id==='wViv'){const qs=encodeURIComponent((val('wN')+' '+val('wA')).trim());t.href='https://www.vivino.com/search/wines?q='+qs;return}
  if(t.tagName==='A')return;
  if(t.hasAttribute('data-x'))return close();
  const d=t.dataset;
  if(d.esp){S.esp=d.esp;S.vt=null;S.placing=null;return render()}
  if(d.vt){S.vt=d.vt;S.placing=null;remember();return render()}
  if(d.slot)return safe(()=>clickSlot(d.slot));
  if(d.wine)return ficha(d.wine);
  if('fe' in d){S.fe=S.fe===d.fe?'':d.fe;return renderList()}
  if('ft' in d){S.ft=S.ft===d.ft?'':d.ft;return renderList()}
  if(d.rm){const e2=esp();return safe(async()=>{await q(sb.from('miembros').delete().eq('espacio_id',e2.id).eq('user_id',d.rm));await loadAll();shareModal()})}
  const id=t.id,did=d.id;
  if(id==='newEsp'||id==='newEsp2')return espModal();
  if(id==='eOk')return safe(crearEsp);
  if(id==='newVt')return vtModal();
  if(id==='editVt')return vtModal(S.vinotecas.find(v=>v.id===S.vt));
  if(id==='vOk')return safe(()=>guardarVt(did));
  if(id==='vDel'){if(d.sure){const vid=S.vt;return safe(async()=>{await q(sb.from('vinos').update({vinoteca_id:null,pos:[]}).eq('vinoteca_id',vid));await del('vinotecas',vid);S.vt=null;close();await loadAll()})}d.sure=1;t.textContent='Confirmar: sus vinos quedan sin vinoteca';return}
  if(id==='share')return shareModal();
  if(id==='acct')return acctModal();
  if(id==='aOk')return safe(async()=>{const n=val('aN');await upd('profiles',S.me,{nombre:n||null});S.names[S.me]=n||S.email;close();render();msg('Nombre guardado.')});
  if(id==='logout')return safe(async()=>{close();await sb.auth.signOut()});
  if(id==='eRen'){const e2=esp();const inp=$('card').querySelector('#eRenI');if(inp)return safe(async()=>{await upd('espacios',e2.id,{nombre:inp.value.trim()||e2.nombre});close();await loadAll()});t.insertAdjacentHTML('beforebegin',`<input id="eRenI" value="${esc(e2.nombre)}" style="width:12em" aria-label="Nuevo nombre">`);t.textContent='Guardar nombre';return}
  if(id==='eDel'){if(d.sure){const e2=esp();return safe(async()=>{await del('espacios',e2.id);S.esp=null;close();await loadAll()})}d.sure=1;t.textContent='Confirmar: se borra todo';return}
  if(id==='eLeave'){if(d.sure){const e2=esp();return safe(async()=>{await q(sb.from('miembros').delete().eq('espacio_id',e2.id).eq('user_id',S.me));S.esp=null;close();await loadAll()})}d.sure=1;t.textContent='Confirmar: dejarás de verlo';return}
  if(id==='addWine')return wineForm();
  if(id==='wOk')return safe(()=>guardarVino(did));
  if(id==='drink')return safe(()=>beber(did));
  if(id==='place'||id==='replace'){S.placing=did;S.vt=S.vinos.find(x=>x.id===did).vinotecaId;close();render();window.scrollTo({top:0,behavior:'smooth'});if(id==='replace')msg('Toca sus botellas para quitarlas y luego los huecos nuevos.');return}
  if(id==='donePlace'){S.placing=null;return render()}
  if(id==='edit')return wineForm(S.vinos.find(x=>x.id===did));
  if(id==='del'){if(d.sure)return safe(async()=>{await del('vinos',did);close();await loadAll();msg('Vino eliminado.')});d.sure=1;t.textContent='Confirmar eliminación';return}
  if(id==='tBod'||id==='tBeb'){S.tab=id==='tBod'?'bod':'beb';return renderList()}
});
document.addEventListener('submit',e=>{if(e.target.id==='addPF'){e.preventDefault();safe(addPersona)}});
$('q').addEventListener('input',e=>{S.q=e.target.value;renderList()});

/* ---------- acceso ---------- */
const here=()=>location.origin+location.pathname;
function authView(mode,note){
  document.body.dataset.view='auth';
  const T={in:['Entra en tu bodega','Entrar'],up:['Crea tu cuenta','Crear cuenta'],reset:['Recupera tu contraseña','Enviarme un enlace'],newpass:['Nueva contraseña','Guardar contraseña']}[mode];
  $('authc').innerHTML=`${bottle('#9b1631',30)}<h1>${T[0]}</h1>
  <form id="authF" data-mode="${mode}">
  ${mode==='up'?'<label>Tu nombre<input id="uN" autocomplete="name" required></label>':''}
  ${mode!=='newpass'?'<label>Correo<input id="uE" type="email" autocomplete="email" required></label>':''}
  ${mode!=='reset'?`<label>Contraseña<input id="uP" type="password" minlength="6" autocomplete="${mode==='in'?'current-password':'new-password'}" required></label>`:''}
  <p id="uMsg" class="${note?'ok':'err'}" role="status">${esc(note||'')}</p>
  <button class="btn p" type="submit">${T[1]}</button></form>
  <div class="row" style="justify-content:space-between;margin-top:10px">${mode==='in'?'<button class="lnk" data-auth="up">Crear cuenta</button><button class="lnk" data-auth="reset">He olvidado la contraseña</button>':mode==='newpass'?'':'<button class="lnk" data-auth="in">Ya tengo cuenta</button>'}</div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(b)authView(b.dataset.auth)});
document.addEventListener('submit',async e=>{if(e.target.id!=='authF')return;e.preventDefault();
  const f=e.target,mode=f.dataset.mode,out=$('uMsg'),btn=f.querySelector('button[type=submit]'),v=id=>($(id)?.value||'').trim();
  out.className='err';out.textContent='';btn.disabled=true;
  try{let r;
    if(mode==='in')r=await sb.auth.signInWithPassword({email:v('uE'),password:$('uP').value});
    else if(mode==='up'){r=await sb.auth.signUp({email:v('uE'),password:$('uP').value,options:{data:{nombre:v('uN')},emailRedirectTo:here()}});if(!r.error&&!r.data.session)return authView('in','Te hemos enviado un correo. Ábrelo para confirmar la cuenta y luego entra.')}
    else if(mode==='reset'){r=await sb.auth.resetPasswordForEmail(v('uE'),{redirectTo:here()});if(!r.error)return authView('in','Si ese correo tiene cuenta, te llegará un enlace para cambiar la contraseña.')}
    else{r=await sb.auth.updateUser({password:$('uP').value});if(!r.error){msg('Contraseña cambiada.');return enter(r.data.user)}}
    if(r.error)out.textContent=/Invalid login/i.test(r.error.message)?'Correo o contraseña incorrectos.':/not confirmed/i.test(r.error.message)?'Aún no has confirmado el correo. Busca el mensaje de confirmación.':/already registered/i.test(r.error.message)?'Ese correo ya tiene cuenta. Entra o recupera la contraseña.':/at least/i.test(r.error.message)?'La contraseña debe tener al menos 6 caracteres.':r.error.message;
  }catch(x){out.textContent='Sin conexión. Vuelve a intentarlo.'}finally{btn.disabled=false}
});

async function enter(user){
  if(!user)return;
  document.body.dataset.view='app';
  if(S.me===user.id&&S.loaded)return;
  S.me=user.id;S.email=user.email||'';S.loaded=false;render();
  try{await loadAll()}catch(e){console.error(e);msg('No se ha podido cargar la bodega. Comprueba la conexión.',true)}
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('bodega').on('postgres_changes',{event:'*',schema:'public'},refresh).subscribe();
}
function leave(){
  if(chan){sb.removeChannel(chan);chan=null}
  Object.assign(S,{me:null,email:'',names:{},espacios:[],miembros:[],vinotecas:[],vinos:[],consumos:[],placing:null,loaded:false});
  authView('in');
}

/* ---------- arranque ---------- */
if(!sb){document.body.dataset.view='setup'}
else{
  let recovering=false;
  sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;return authView('newpass')}
    if(recovering)return;
    if(s?.user)enter(s.user);else leave();
  },0)});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me)refresh()});
}
}
</script>
